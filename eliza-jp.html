<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工無能 - 日本語版ELiza</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #00ff41;
  font-family: "MS Gothic", "Osaka-Mono", "Noto Sans Mono CJK JP", "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

#container {
  width: 720px;
  max-width: 100%;
  border: 1px solid #00ff41;
  box-shadow: 0 0 30px rgba(0, 255, 65, 0.15), inset 0 0 30px rgba(0, 255, 65, 0.03);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

#header {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.4);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  background: rgba(0, 255, 65, 0.03);
}

#header h1 {
  font-size: 1.1em;
  font-weight: normal;
  letter-spacing: 0.1em;
}

#header .version {
  font-size: 0.75em;
  opacity: 0.5;
}

#display {
  height: 450px;
  overflow-y: auto;
  padding: 20px;
  line-height: 1.8;
  position: relative;
  scroll-behavior: smooth;
}

#display::after {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.08) 0px,
    rgba(0, 0, 0, 0.08) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 10;
}

#display::-webkit-scrollbar {
  width: 6px;
}
#display::-webkit-scrollbar-track {
  background: rgba(0, 255, 65, 0.05);
}
#display::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 65, 0.3);
  border-radius: 3px;
}

.msg {
  margin-bottom: 12px;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.msg-eliza {
  color: #00ff41;
  text-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
}

.msg-user {
  color: #00cc33;
  opacity: 0.85;
}

.msg-system {
  color: rgba(0, 255, 65, 0.4);
  font-size: 0.85em;
  text-align: center;
  margin: 8px 0;
}

.label {
  font-weight: bold;
  margin-right: 0.3em;
}

.typing-indicator {
  color: #00ff41;
  text-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
}

.typing-indicator .dot {
  animation: blink 1s infinite;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

#input-area {
  border-top: 1px solid rgba(0, 255, 65, 0.4);
  padding: 12px 20px;
  display: flex;
  gap: 10px;
  background: rgba(0, 255, 65, 0.02);
}

#user-input {
  flex: 1;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(0, 255, 65, 0.5);
  color: #00ff41;
  font-family: inherit;
  font-size: 1em;
  padding: 10px 14px;
  outline: none;
  border-radius: 3px;
  caret-color: #00ff41;
  transition: border-color 0.2s;
}

#user-input:focus {
  border-color: #00ff41;
  box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
}

#user-input::placeholder {
  color: rgba(0, 255, 65, 0.25);
}

#user-input:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

#send-btn {
  background: rgba(0, 255, 65, 0.15);
  color: #00ff41;
  border: 1px solid rgba(0, 255, 65, 0.5);
  padding: 10px 20px;
  font-family: inherit;
  font-size: 1em;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.2s;
}

#send-btn:hover {
  background: rgba(0, 255, 65, 0.25);
  box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
}

#send-btn:active {
  background: rgba(0, 255, 65, 0.35);
}

#send-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

#footer {
  padding: 8px 20px;
  border-top: 1px solid rgba(0, 255, 65, 0.15);
  font-size: 0.7em;
  opacity: 0.35;
  text-align: center;
}

@media (max-width: 600px) {
  body { padding: 10px; }
  #display { height: 350px; padding: 15px; }
  #header h1 { font-size: 0.95em; }
}
</style>
</head>

<!-- ========== 改造エンジン (elizabot-jp) ========== -->
<script>

function ElizaBot(noRandomFlag) {
  this.noRandom = (noRandomFlag) ? true : false;
  this.debug = false;
  this.memSize = 20;
  this.version = "1.0-jp";
  if (!this._dataParsed) this._init();
  this.reset();
}

ElizaBot.prototype.reset = function() {
  this.quit = false;
  this.mem = [];
  this.lastchoice = [];
  for (var k = 0; k < elizaKeywords.length; k++) {
    this.lastchoice[k] = [];
    var rules = elizaKeywords[k][2];
    for (var i = 0; i < rules.length; i++) this.lastchoice[k][i] = -1;
  }
};

ElizaBot.prototype._dataParsed = false;

ElizaBot.prototype._init = function() {
  var global = ElizaBot.prototype.global = self;

  // synonym patterns
  var synPatterns = {};
  if ((global.elizaSynons) && (typeof elizaSynons == 'object')) {
    for (var i in elizaSynons) synPatterns[i] = '(' + i + '|' + elizaSynons[i].join('|') + ')';
  }

  if ((!global.elizaKeywords) || (typeof elizaKeywords.length == 'undefined')) {
    elizaKeywords = [['###', 0, [['###', []]]]];
  }

  // convert rules to regexps
  var sre = /@(\S+)/;
  var are = /(\S)\s*\*\s*(\S)/;
  var are1 = /^\s*\*\s*(\S)/;
  var are2 = /(\S)\s*\*\s*$/;
  var are3 = /^\s*\*\s*$/;
  var wsre = /\s+/g;

  for (var k = 0; k < elizaKeywords.length; k++) {
    var rules = elizaKeywords[k][2];
    elizaKeywords[k][3] = k;
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      // check mem flag
      if (r[0].charAt(0) == '$') {
        var ofs = 1;
        while (r[0].charAt(ofs) == ' ') ofs++;
        r[0] = r[0].substring(ofs);
        r[2] = true;
      } else {
        r[2] = false;
      }
      // expand synonyms
      var m = sre.exec(r[0]);
      while (m) {
        var sp = (synPatterns[m[1]]) ? synPatterns[m[1]] : m[1];
        r[0] = r[0].substring(0, m.index) + sp + r[0].substring(m.index + m[0].length);
        m = sre.exec(r[0]);
      }
      // expand asterisk expressions (NO \b for Japanese)
      if (are3.test(r[0])) {
        r[0] = '(.*)';
      } else {
        m = are.exec(r[0]);
        if (m) {
          var lp = '';
          var rp = r[0];
          while (m) {
            lp += rp.substring(0, m.index + 1);
            lp += '(.*)';
            lp += m[2];
            rp = rp.substring(m.index + m[0].length);
            m = are.exec(rp);
          }
          r[0] = lp + rp;
        }
        m = are1.exec(r[0]);
        if (m) {
          var lp = '(.*)';
          r[0] = lp + r[0].substring(m.index - 1 + m[0].length);
        }
        m = are2.exec(r[0]);
        if (m) {
          var lp = r[0].substring(0, m.index + 1);
          r[0] = lp + '(.*)';
        }
      }
      // expand white space (optional for Japanese)
      r[0] = r[0].replace(wsre, '\\s*');
      wsre.lastIndex = 0;
    }
  }

  // sort by rank
  elizaKeywords.sort(this._sortKeywords);

  // pre/post substitution regexps (NO \b for Japanese)
  ElizaBot.prototype.pres = {};
  ElizaBot.prototype.posts = {};

  if ((global.elizaPres) && (elizaPres.length)) {
    var a = [];
    for (var i = 0; i < elizaPres.length; i += 2) {
      a.push(elizaPres[i]);
      ElizaBot.prototype.pres[elizaPres[i]] = elizaPres[i + 1];
    }
    ElizaBot.prototype.preExp = new RegExp('(' + a.join('|') + ')');
  } else {
    ElizaBot.prototype.preExp = /####/;
    ElizaBot.prototype.pres['####'] = '####';
  }

  if ((global.elizaPosts) && (elizaPosts.length)) {
    var a = [];
    for (var i = 0; i < elizaPosts.length; i += 2) {
      a.push(elizaPosts[i]);
      ElizaBot.prototype.posts[elizaPosts[i]] = elizaPosts[i + 1];
    }
    ElizaBot.prototype.postExp = new RegExp('(' + a.join('|') + ')');
  } else {
    ElizaBot.prototype.postExp = /####/;
    ElizaBot.prototype.posts['####'] = '####';
  }

  if ((!global.elizaQuits) || (typeof elizaQuits.length == 'undefined')) {
    elizaQuits = [];
  }

  ElizaBot.prototype._dataParsed = true;
};

ElizaBot.prototype._sortKeywords = function(a, b) {
  if (a[1] > b[1]) return -1;
  else if (a[1] < b[1]) return 1;
  else if (a[3] > b[3]) return 1;
  else if (a[3] < b[3]) return -1;
  else return 0;
};

ElizaBot.prototype.transform = function(text) {
  var rpl = '';
  this.quit = false;

  // NO toLowerCase for Japanese (no case distinction)

  // normalize full-width alphanumeric to half-width
  text = text.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
    return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
  });
  // normalize full-width space
  text = text.replace(/\u3000/g, ' ');

  // remove noise
  text = text.replace(/[@#\$%\^&\*\(\)_\+=~`\{\[\}\]\|:;<>\/\\\t]/g, ' ');
  // remove www/ww
  text = text.replace(/[wｗ]{2,}/g, '');
  text = text.replace(/\s+-+\s+/g, '.');
  // split on Japanese & western punctuation
  text = text.replace(/\s*[,.\?!;。！？、]+\s*/g, '.');
  // split on adversative conjunctions (Japanese "but")
  text = text.replace(/でも/g, '.');
  text = text.replace(/しかし/g, '.');
  text = text.replace(/けれども/g, '.');
  text = text.replace(/けど/g, '.');
  text = text.replace(/\s{2,}/g, ' ');

  var parts = text.split('.');
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i].trim();
    if (part != '') {
      // check for quit
      for (var q = 0; q < elizaQuits.length; q++) {
        if (part.indexOf(elizaQuits[q]) >= 0) {
          this.quit = true;
          return this.getFinal();
        }
      }
      // preprocess
      var m = this.preExp.exec(part);
      if (m) {
        var lp = '';
        var rp = part;
        while (m) {
          lp += rp.substring(0, m.index) + this.pres[m[1]];
          rp = rp.substring(m.index + m[0].length);
          m = this.preExp.exec(rp);
        }
        part = lp + rp;
      }
      this.sentence = part;
      // keyword matching (NO \b, use indexOf)
      for (var k = 0; k < elizaKeywords.length; k++) {
        if (elizaKeywords[k][0] == 'xnone') continue;
        if (part.indexOf(elizaKeywords[k][0]) >= 0) {
          rpl = this._execRule(k);
        }
        if (rpl != '') return rpl;
      }
    }
  }
  // try memory
  rpl = this._memGet();
  // try xnone
  if (rpl == '') {
    this.sentence = ' ';
    var k = this._getRuleIndexByKey('xnone');
    if (k >= 0) rpl = this._execRule(k);
  }
  return (rpl != '') ? rpl : 'すみません、よくわかりませんでした。';
};

ElizaBot.prototype._execRule = function(k) {
  var rule = elizaKeywords[k];
  var decomps = rule[2];
  var paramre = /\(([0-9]+)\)/;
  for (var i = 0; i < decomps.length; i++) {
    var m = this.sentence.match(decomps[i][0]);
    if (m != null) {
      var reasmbs = decomps[i][1];
      var memflag = decomps[i][2];
      var ri = (this.noRandom) ? 0 : Math.floor(Math.random() * reasmbs.length);
      if (((this.noRandom) && (this.lastchoice[k][i] > ri)) || (this.lastchoice[k][i] == ri)) {
        ri = ++this.lastchoice[k][i];
        if (ri >= reasmbs.length) {
          ri = 0;
          this.lastchoice[k][i] = -1;
        }
      } else {
        this.lastchoice[k][i] = ri;
      }
      var rpl = reasmbs[ri];
      if (this.debug) alert('match:\nkey: ' + elizaKeywords[k][0] +
        '\nrank: ' + elizaKeywords[k][1] +
        '\ndecomp: ' + decomps[i][0] +
        '\nreasmb: ' + rpl +
        '\nmemflag: ' + memflag);
      if (rpl.search('^goto ') == 0) {
        var ki = this._getRuleIndexByKey(rpl.substring(5));
        if (ki >= 0) return this._execRule(ki);
      }
      // substitute positional params
      var m1 = paramre.exec(rpl);
      if (m1) {
        var lp = '';
        var rp = rpl;
        while (m1) {
          var param = m[parseInt(m1[1])];
          if (param) {
            // postprocess param (pronoun reflection)
            var m2 = this.postExp.exec(param);
            if (m2) {
              var lp2 = '';
              var rp2 = param;
              while (m2) {
                lp2 += rp2.substring(0, m2.index) + this.posts[m2[1]];
                rp2 = rp2.substring(m2.index + m2[0].length);
                m2 = this.postExp.exec(rp2);
              }
              param = lp2 + rp2;
            }
          } else {
            param = '';
          }
          lp += rp.substring(0, m1.index) + param;
          rp = rp.substring(m1.index + m1[0].length);
          m1 = paramre.exec(rp);
        }
        rpl = lp + rp;
      }
      rpl = this._postTransform(rpl);
      if (memflag) this._memSave(rpl);
      else return rpl;
    }
  }
  return '';
};

ElizaBot.prototype._postTransform = function(s) {
  s = s.replace(/\s{2,}/g, ' ');
  s = s.replace(/\s+\./g, '.');
  if ((this.global.elizaPostTransforms) && (elizaPostTransforms.length)) {
    for (var i = 0; i < elizaPostTransforms.length; i += 2) {
      s = s.replace(elizaPostTransforms[i], elizaPostTransforms[i + 1]);
      elizaPostTransforms[i].lastIndex = 0;
    }
  }
  // NO capitalize first letter (Japanese has no case)
  return s;
};

ElizaBot.prototype._getRuleIndexByKey = function(key) {
  for (var k = 0; k < elizaKeywords.length; k++) {
    if (elizaKeywords[k][0] == key) return k;
  }
  return -1;
};

ElizaBot.prototype._memSave = function(t) {
  this.mem.push(t);
  if (this.mem.length > this.memSize) this.mem.shift();
};

ElizaBot.prototype._memGet = function() {
  if (this.mem.length) {
    if (this.noRandom) return this.mem.shift();
    else {
      var n = Math.floor(Math.random() * this.mem.length);
      var rpl = this.mem[n];
      for (var i = n + 1; i < this.mem.length; i++) this.mem[i - 1] = this.mem[i];
      this.mem.length--;
      return rpl;
    }
  } else return '';
};

ElizaBot.prototype.getFinal = function() {
  if (!ElizaBot.prototype.global.elizaFinals) return '';
  return elizaFinals[Math.floor(Math.random() * elizaFinals.length)];
};

ElizaBot.prototype.getInitial = function() {
  if (!ElizaBot.prototype.global.elizaInitials) return '';
  return elizaInitials[Math.floor(Math.random() * elizaInitials.length)];
};

</script>

<!-- ========== UIコントローラー ========== -->
<script>
(function() {
  var eliza = new ElizaBot();
  var display = document.getElementById('display');
  var input = document.getElementById('user-input');
  var sendBtn = document.getElementById('send-btn');
  var isWaiting = false;

  function addMessage(sender, text) {
    var div = document.createElement('div');
    div.className = 'msg';
    if (sender === 'eliza') {
      div.classList.add('msg-eliza');
      div.innerHTML = '<span class="label">エリザ:</span> ' + escapeHtml(text);
    } else if (sender === 'user') {
      div.classList.add('msg-user');
      div.innerHTML = '<span class="label">あなた:</span> ' + escapeHtml(text);
    } else {
      div.classList.add('msg-system');
      div.textContent = text;
    }
    display.appendChild(div);
    display.scrollTop = display.scrollHeight;
  }

  function addTypingIndicator() {
    var div = document.createElement('div');
    div.className = 'msg msg-eliza typing-indicator';
    div.id = 'typing';
    div.innerHTML = '<span class="label">エリザ:</span> <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
    display.appendChild(div);
    display.scrollTop = display.scrollHeight;
  }

  function removeTypingIndicator() {
    var el = document.getElementById('typing');
    if (el) el.parentNode.removeChild(el);
  }

  function escapeHtml(text) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(text));
    return d.innerHTML;
  }

  function elizaStep() {
    if (isWaiting) return;
    var userText = input.value.trim();
    if (!userText) return;

    addMessage('user', userText);
    input.value = '';
    input.focus();

    isWaiting = true;
    input.disabled = true;
    sendBtn.disabled = true;

    var reply = eliza.transform(userText);

    addTypingIndicator();

    var delay = 400 + Math.random() * 800;
    setTimeout(function() {
      removeTypingIndicator();
      addMessage('eliza', reply);

      if (eliza.quit) {
        addMessage('system', '--- セッション終了 ---');
        input.disabled = true;
        sendBtn.disabled = true;
        input.placeholder = 'セッションは終了しました';
      } else {
        isWaiting = false;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }, delay);
  }

  // initialize
  addMessage('eliza', eliza.getInitial());
  addMessage('system', '何でもお気軽にお話しください。終了するには「さようなら」と入力してください。');

  // event listeners (IME対応: 変換中のEnterでは送信しない)
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      elizaStep();
    }
  });
  // compositionend後のEnterも防ぐためのフォールバック
  input.addEventListener('compositionend', function() {
    // compositionend直後にkeydownが発火する場合があるので何もしない
  });
  sendBtn.addEventListener('click', elizaStep);
  input.focus();
})();
</script>
